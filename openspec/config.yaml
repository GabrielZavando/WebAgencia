schema: spec-driven

# Contexto del proyecto para la IA
context: |
  Tech stack: Astro, TypeScript, Vanilla JS (para islas/componentes de cliente), Tailwind CSS (si aplica).
  Arquitectura objetivo: 100% SSG (Static Site Generation). La web se despliega en Hostinger (archivos estáticos).
  Desacoplamiento: Toda la interactividad (Blog, Formularios de Contacto y Newsletter) se delega a llamadas fetch asíncronas desde el cliente hacia una "API Ligera" externa (NestJS).
  Eliminación: Se deben remover por completo las rutas privadas (/admin, /dashboard), el middleware de autenticación y las dependencias de servidor (firebase-admin, @astrojs/node).
  Convenciones: 
    - Respuestas y comentarios de código en español.
    - Priorizar rendimiento: usar esqueletos de carga (skeleton loaders) y estados de deshabilitado en botones durante fetch.
    - No alucinar dependencias: no instalar nuevas librerías pesadas sin justificación explícita.

# Reglas por tipo de artefacto
rules:
  proposal:
    - Mantener la propuesta enfocada estrictamente en el ticket LANDING-001.
    - Incluir siempre una sección de "No-objetivos" (Non-goals) para evitar scope creep (ej: no migrar la API, solo el frontend).
  specs:
    - Especificar claramente los endpoints de la API Ligera que consumirá el cliente (GET /api/v1/blog/posts, POST /api/v1/leads/subscribe, POST /api/v1/leads/contact).
    - Definir el comportamiento de estados de carga y error en el cliente.
  tasks:
    - Dividir las tareas en pasos pequeños y verificables (máximo 1-2 horas de trabajo por tarea).
    - Ordenar las tareas secuencialmente: 1) Limpieza, 2) Configuración Astro, 3) Implementación de islas/scripts de cliente.
  design:
    - Justificar cualquier decisión que afecte el SEO o la experiencia de usuario (ej: carga asíncrona del blog).
