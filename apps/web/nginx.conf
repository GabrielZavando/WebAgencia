# Nginx config for the static public site (apps/web/dist).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Basic gzip for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Long-lived cache for hashed build assets
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Static routes: exact file, directory index, else 404 status
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Serve the SSG 404 page with a proper 404 status
    error_page 404 /404.html;

    # Health endpoint for the static container
    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
