openapi: 3.0.3
info:
  title: WebAgenciaAstro — API consumida
  description: |
    Contrato de la API externa (NestJS) consumida por WebAgenciaAstro.
    NO es una API propia. Se documenta aquí para mantener la integración sincronizada
    y como referencia para los tests del cliente (apiClient).

    Reglas:
    - Versionado en URL: /api/v1/
    - Backend asume NestJS + JSON
    - Auth via Bearer JWT para endpoints autenticados (futuro /auth/login)
    - Formularios públicos envían token Turnstile cuando aplique

  version: "1.0.0"

servers:
  - url: http://localhost:8080/api/v1
    description: Desarrollo local (NestJS)
  - url: https://nestjs-api-XXXXXXXXXX.us-central1.run.app/api/v1
    description: Producción (Cloud Run)

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        statusCode:
          type: integer
        error:
          type: string
      required:
        - statusCode

    LeadInput:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: string
        subject:
          type: string
        message:
          type: string
          minLength: 10
        turnstileToken:
          type: string
          description: Token de Cloudflare Turnstile (inyectado por apiClient si PUBLIC_TURNSTILE_SITE_KEY está definido)

    LeadAccepted:
      type: object
      properties:
        id:
          type: string
        received:
          type: boolean
          example: true

    BlogPost:
      type: object
      required:
        - slug
        - title
        - published
      properties:
        slug:
          type: string
        title:
          type: string
        excerpt:
          type: string
        content:
          type: string
        coverImage:
          type: string
          format: uri
        category:
          type: string
        author:
          type: string
        publishedAt:
          type: string
          format: date
        published:
          type: boolean
        createdAt:
          type: object
          description: Firestore-style timestamp { _seconds, _nanoseconds }
        updatedAt:
          type: object

    LoginInput:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 128
          format: password
        turnstileToken:
          type: string

    AuthSession:
      type: object
      properties:
        token:
          type: string
          description: JWT bearer
        user:
          type: object
          properties:
            email:
              type: string
              format: email
            role:
              type: string
              enum: [admin]
        expiresAt:
          type: string
          format: date-time

security:
  - bearerAuth: []

paths:
  /health:
    get:
      summary: Health check del backend consumido
      security: []
      responses:
        "200":
          description: API operativa
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /leads/contact:
    post:
      summary: Captura de lead desde formulario público
      description: Endpoint consumido por `src/components/landing/Contact.astro`. Anti-spam integrado (honeypot, Turnstile, análisis contenido).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadInput"
      responses:
        "201":
          description: Lead aceptado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadAccepted"
        "400":
          description: Validación fallida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit excedido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blog/posts:
    get:
      summary: Lista de posts publicados (consumido por CSR)
      description: Consumido por `src/scripts/blog-fetch.ts`. Cache local 5 min en sessionStorage.
      security: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [published]
          required: false
      responses:
        "200":
          description: Lista de posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog:
    get:
      summary: Lista cruda de posts (incluye drafts) — usado por sitemap
      description: Consumido por `src/pages/sitemap.xml.ts` en build time. Filtra por `published === true`.
      security: []
      responses:
        "200":
          description: Posts (mezclados)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /auth/login:
    post:
      summary: Login admin (futuro — feature piloto login-island)
      description: |
        Autenticación para 1 usuario admin único. No hay endpoint de registro.
        Username/email y password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSession"
        "401":
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # Siguientes endpoints reales a documentar: /newsletter/subscribe, /newsletter/confirm, /diagnostico
